# Alembic configuration for Fiscal Astra.
#
# The database URL is intentionally left blank here: it is injected at runtime
# from ASTRA_DATABASE_URL (see migrations/env.py) so credentials never live in
# version control.

[alembic]
script_location = migrations
prepend_sys_path = src
sqlalchemy.url =
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S